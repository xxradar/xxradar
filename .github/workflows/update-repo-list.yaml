name: Update repo list

on:
  workflow_dispatch:

jobs:
  create-and-commit-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Fetch Repositories and Create Markdown List
        run: |
          set -euo pipefail

          git config user.name "xxradar"
          git config user.email "xxradar@radarhack.com"

          page=1
          repos=()

          while true; do
            response=$(curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/repos?per_page=100&page=${page}&type=owner&sort=full_name&direction=asc")

            if [ "$(echo "$response" | jq -r 'type')" != "array" ]; then
              echo "Unexpected GitHub API response:"
              echo "$response" | jq .
              exit 1
            fi

            if [ "$(echo "$response" | jq 'length')" -eq 0 ]; then
              break
            fi

            mapfile -t page_repos < <(echo "$response" | jq -r '.[].full_name')
            repos+=("${page_repos[@]}")

            page=$((page + 1))
          done

          > list.md

          for repo in "${repos[@]}"; do
            echo "- [https://github.com/${repo}](https://github.com/${repo})" >> list.md
          done

          if ! git diff --quiet; then
            git add list.md
            git commit -m "Update repository list"
            git push
          else
            echo "No changes in repository list"
          fi
